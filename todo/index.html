<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Yapılacaklar">
<title>Yapılacaklar</title>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#273449;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;
  --acc:#6366f1;--acc2:#818cf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;
  --p1:#38bdf8;--p2:#f59e0b;--p3:#ef4444;--r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
body.light{--bg:#f1f5f9;--card:#fff;--card2:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* Giriş */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:28px;text-align:center}
.auth-box h1{margin:0 0 6px;font-size:26px}
.auth-box p{color:var(--muted);margin:0 0 22px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--acc)}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;margin-bottom:10px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;min-height:20px}

/* Üst bar */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--safe-t) + 12px) 16px 8px}
.top{display:flex;align-items:center;gap:10px}
.top h2{margin:0;font-size:24px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.sub{color:var(--muted);font-size:13px;margin:4px 0 10px}
.search{display:flex;gap:8px}
.search input{flex:1;margin:0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 0 4px}
.chip{padding:8px 4px;border-radius:12px;background:var(--card);white-space:nowrap;font-size:13px;border:1px solid transparent;overflow:hidden;text-overflow:ellipsis;text-align:center}
.chip.on{background:var(--acc);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-size:12px}

/* Liste */
main{padding:4px 16px calc(110px + var(--safe-b))}
.group-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px;display:flex;justify-content:space-between}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;border-left:4px solid transparent;transition:opacity .2s}
.task.p1{border-left-color:var(--p1)}.task.p2{border-left-color:var(--p2)}.task.p3{border-left-color:var(--p3)}
.task.done{opacity:.5}
.task.done .t-title{text-decoration:line-through}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.t-body{flex:1;min-width:0}
.t-title{word-wrap:break-word;line-height:1.35}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.t-meta span{background:var(--card2);padding:2px 8px;border-radius:999px}
.t-meta .late{color:var(--bad)}
.t-meta .today{color:var(--warn)}
.pin{width:34px;height:34px;border-radius:10px;flex-shrink:0;font-size:17px;opacity:.35;filter:grayscale(1);margin:-4px -4px -4px 0}
.pin.on{opacity:1;filter:none;background:var(--card2)}
.streak{color:var(--warn)}
.task{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.task.pressing{transform:scale(.97);transition:transform .15s}
#moveMenu{position:fixed;z-index:70;width:230px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#moveMenu .mh{font-size:12px;color:var(--muted);padding:6px 10px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#moveMenu button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 10px;border-radius:10px;text-align:left;font-size:15px}
#moveMenu button.hl{background:var(--acc);color:#fff}
#moveMenu button.cur{opacity:.4}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty div{font-size:46px;margin-bottom:8px}

/* Hızlı ekleme */
.quick{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%)}
.quick form{display:flex;gap:8px;max-width:720px;margin:0 auto}
.quick input{flex:1;margin:0;background:var(--card);padding:15px}
.quick button{width:52px;border-radius:12px;background:var(--acc);color:#fff;font-size:26px}

/* Alt sayfa (sheet) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:8px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet{overscroll-behavior:contain}
.sheet-x{position:sticky;top:0;float:right;margin:-2px -6px 0 0;width:38px;height:38px;border-radius:50%;background:var(--card2);font-size:18px;z-index:2}
.grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:4px auto 14px}
.sheet h3{margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:10px}.row>*{flex:1}
textarea.inp{min-height:80px;resize:vertical}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--acc);color:#fff}
.sublist .s{display:flex;align-items:center;gap:8px;padding:6px 0}
.sublist .s input[type=text]{flex:1;margin:0;padding:8px 10px}
.sublist .s .x{color:var(--bad);font-size:18px;padding:4px 8px}
.cb{width:20px;height:20px;accent-color:var(--ok)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{margin:0}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.menu-item .dot{width:12px;height:12px;border-radius:50%}
.menu-item .cnt{margin-left:auto;color:var(--muted);font-size:14px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast button{color:var(--acc2);font-weight:600}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat div{background:var(--card2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{color:var(--muted)}
</style>
</head>
<body>

<!-- UYGULAMA -->
<section id="app">
  <header>
    <div class="top">
      <button class="icon-btn" id="menuBtn" aria-label="Menü">☰</button>
      <h2 id="viewTitle">Bugün</h2>
      <button class="icon-btn" id="sortBtn" aria-label="Sırala">⇅</button>
    </div>
    <div class="sub" id="viewSub"></div>
    <div class="search"><input class="inp" id="q" type="search" placeholder="🔍 Ara: başlık, not, #etiket"></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="list"></main>
  <div class="quick">
    <form id="quickForm" autocomplete="off">
      <input class="inp" id="quickInput" placeholder="">
      <button type="submit" aria-label="Ekle">+</button>
    </form>
  </div>
</section>

<div class="overlay" id="overlay"></div>

<!-- GÖREV DÜZENLE -->
<div class="sheet" id="taskSheet">
  <div class="grab"></div>
  <h3 id="sheetTitle">Görev</h3>
  <div class="field"><input class="inp" id="fTitle" placeholder="Başlık"></div>
  <div class="field"><label>Not</label><textarea class="inp" id="fNote" placeholder="Ayrıntılar…"></textarea></div>
  <div class="row">
    <div class="field"><label>Tarih</label><input class="inp" id="fDue" type="date"></div>
    <div class="field"><label>Saat</label><input class="inp" id="fTime" type="time"></div>
  </div>
  <div class="field"><label>Öncelik</label>
    <div class="seg" id="fPrio">
      <button data-v="0">Yok</button><button data-v="1">Düşük</button><button data-v="2">Orta</button><button data-v="3">Yüksek</button>
    </div>
  </div>
  <div class="row">
    <div class="field"><label>Liste</label><select class="inp" id="fList"></select></div>
    <div class="field"><label>Tekrar</label>
      <select class="inp" id="fRepeat">
        <option value="none">Tekrar yok</option><option value="daily">Her gün</option>
        <option value="weekdays">Hafta içi</option><option value="weekly">Her hafta</option>
        <option value="monthly">Her ay</option><option value="yearly">Her yıl</option>
      </select>
    </div>
  </div>
  <div class="field"><label>Etiketler (virgülle)</label><input class="inp" id="fTags" placeholder="iş, ev, alışveriş"></div>
  <div class="field"><label>Alt görevler</label>
    <div class="sublist" id="fSubs"></div>
    <button class="btn ghost" id="addSub" type="button" style="margin-top:6px">+ Alt görev</button>
  </div>
  <div class="actions">
    <button class="btn danger" id="delTask" style="flex:0 0 auto;width:auto;padding:13px 18px">Sil</button>
    <button class="btn" id="saveTask">Kaydet</button>
  </div>
</div>

<!-- MENÜ -->
<div class="sheet" id="menuSheet">
  <div class="grab"></div>
  <div class="stat" id="stats"></div>
  <div id="menuViews"></div>
  <div class="group-title"><span>Listelerim</span></div>
  <div id="menuLists"></div>
  <button class="menu-item" id="newListBtn">➕ <span>Yeni liste</span></button>
  <div class="group-title"><span>Ayarlar</span></div>
  <button class="menu-item" id="installBtn">📲 <span>Telefon ana ekranına ekle</span></button>
  <button class="menu-item" id="updateBtn">⬇️ <span>Güncellemeleri denetle</span><span class="cnt" id="verLbl"></span></button>
  <button class="menu-item" id="themeBtn">🌓 <span>Açık / koyu tema</span></button>
  <button class="menu-item" id="clearDoneBtn">🧹 <span>Tamamlananları temizle</span></button>
  <button class="menu-item" id="exportBtn">💾 <span>Yedek indir (JSON)</span></button>
</div>

<!-- LİSTE DÜZENLE -->
<div class="sheet" id="listSheet">
  <div class="grab"></div>
  <h3 id="listSheetTitle">Liste</h3>
  <div class="field"><input class="inp" id="lName" placeholder="Liste adı (örn: İş, Ev, Alışveriş)"></div>
  <div class="field"><label>Emoji</label><input class="inp" id="lIcon" placeholder="📁" maxlength="4"></div>
  <div class="field"><label>Renk</label><div class="colors" id="lColors"></div></div>
  <div class="actions">
    <button class="btn danger" id="delList" style="flex:0 0 auto;width:auto;padding:13px 18px">Sil</button>
    <button class="btn" id="saveList">Kaydet</button>
  </div>
</div>

<!-- ANA EKRANA EKLE (iPhone talimatı) -->
<div class="sheet" id="installSheet">
  <div class="grab"></div>
  <h3>📲 Ana ekrana ekle</h3>
  <div id="installSteps" style="line-height:1.7"></div>
</div>

<div id="moveMenu" class="hidden"></div>
<div class="overlay" id="moveOverlay"></div>

<!-- SIRALAMA -->
<div class="sheet" id="sortSheet">
  <div class="grab"></div>
  <h3>Sıralama</h3>
  <div id="sortOpts"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, serverTimestamp, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5UAlvWzKeKUVMrR17Vz2XqIewyZR-zQM",
  authDomain: "muhtelif123.firebaseapp.com",
  projectId: "muhtelif123",
  storageBucket: "muhtelif123.firebasestorage.app",
  messagingSenderId: "904947812712",
  appId: "1:904947812712:web:42b69a4bf9c37826e86edd",
  measurementId: "G-ZCWB4TEB7W"
};

const app = initializeApp(firebaseConfig);
// Çevrimdışı çalışma: internet yokken de eklenir, gelince senkronlanır
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const COLORS = ["#6366f1","#22c55e","#f59e0b","#ef4444","#38bdf8","#ec4899","#a855f7","#14b8a6","#64748b"];
const PRIO = ["", "Düşük", "Orta", "Yüksek"];
const REP = { daily:"Her gün", weekdays:"Hafta içi", weekly:"Her hafta", monthly:"Her ay", yearly:"Her yıl" };

let uid = null, tasks = [], lists = [], unsubs = [];
let view = localStorage.getItem("view") || "today";
let sortBy = localStorage.getItem("sort") || "smart";
let editing = null, editingList = null, subDraft = [], prioDraft = 0, colorDraft = COLORS[0];

/* ---------- Tarih yardımcıları ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() + n); return ymd(d); };
function nextDue(s, rep) {
  const base = s || today();
  const d = new Date(base + "T00:00");
  if (rep === "daily") d.setDate(d.getDate() + 1);
  else if (rep === "weekdays") { do d.setDate(d.getDate() + 1); while ([0,6].includes(d.getDay())); }
  else if (rep === "weekly") d.setDate(d.getDate() + 7);
  else if (rep === "monthly") d.setMonth(d.getMonth() + 1);
  else if (rep === "yearly") d.setFullYear(d.getFullYear() + 1);
  return ymd(d);
}
function dueLabel(t) {
  if (!t.due) return null;
  const td = today();
  let txt, cls = "";
  if (t.due < td && !t.done) { txt = "Gecikti · " + fmtDate(t.due); cls = "late"; }
  else if (t.due === td) { txt = "Bugün"; cls = "today"; }
  else if (t.due === addDays(td, 1)) txt = "Yarın";
  else txt = fmtDate(t.due);
  if (t.time) txt += " " + t.time;
  return { txt, cls };
}
const fmtDate = s => new Date(s + "T00:00").toLocaleDateString("tr-TR", { day:"numeric", month:"short", weekday:"short" });

/* ---------- Hızlı ekleme ayrıştırıcı ----------
   "Fatura öde yarın 14:00 !3 #ev @İş"
   bugün / yarın / pzt..paz / 25.12  → tarih,  !1-3 → öncelik,  #etiket,  @liste */
function parseQuick(str) {
  let title = str, due = "", time = "", priority = 0, tags = [], listId = currentListId();
  const days = { "pzt":1,"pazartesi":1,"sal":2,"salı":2,"çar":3,"çarşamba":3,"per":4,"perşembe":4,"cum":5,"cuma":5,"cmt":6,"cumartesi":6,"paz":0,"pazar":0 };
  title = title.replace(/(^|\s)!([0-3])(?=\s|$)/, (_, a, p) => { priority = +p; return a; });
  title = title.replace(/(^|\s)#([\wçğıöşüÇĞİÖŞÜ-]+)/g, (_, a, t) => { tags.push(t.toLowerCase()); return a; });
  title = title.replace(/(^|\s)@([\wçğıöşüÇĞİÖŞÜ-]+)/, (m, a, n) => {
    const l = lists.find(x => x.name.toLocaleLowerCase("tr") === n.toLocaleLowerCase("tr"));
    if (l) { listId = l.id; return a; } return m;
  });
  title = title.replace(/(^|\s)(\d{1,2}):(\d{2})(?=\s|$)/, (_, a, h, m) => { time = `${pad(h)}:${m}`; return a; });
  title = title.replace(/(^|\s)(bugün|yarın|öbür gün)(?=\s|$)/i, (_, a, w) => {
    w = w.toLocaleLowerCase("tr"); due = w === "bugün" ? today() : addDays(today(), w === "yarın" ? 1 : 2); return a; });
  title = title.replace(/(^|\s)(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?=\s|$)/, (_, a, d, m, y) => {
    const now = new Date(); let yr = y ? (y.length === 2 ? 2000 + +y : +y) : now.getFullYear();
    let s = `${yr}-${pad(m)}-${pad(d)}`; if (!y && s < today()) s = `${yr+1}-${pad(m)}-${pad(d)}`;
    due = s; return a; });
  if (!due) title = title.replace(/(^|\s)(pazartesi|salı|çarşamba|perşembe|cumartesi|cuma|pazar|pzt|sal|çar|per|cum|cmt|paz)(?=\s|$)/i, (_, a, w) => {
    const target = days[w.toLocaleLowerCase("tr")]; const d = new Date();
    let diff = (target - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + diff); due = ymd(d); return a; });
  if (time && !due) due = today();
  if (!due && view === "today") due = today();
  if (view === "mine") return { title: title.replace(/\s+/g, " ").trim(), due, time, priority, tags, listId: "", mine: true };
  if (view === "daily") return { title: title.replace(/\s+/g, " ").trim(), due: "", time, priority, tags, listId: "", daily: true, dailyDone: false };
  if (view === "important" && !priority) priority = 3;
  return { title: title.replace(/\s+/g, " ").trim(), due, time, priority, tags, listId };
}

/* ---------- Giriş yok ----------
   Veriler sabit "todo/ercan" yolunda tutulur; telefon / bilgisayar aynı listeyi görür. */
const OWNER = "ercan";
const col = name => collection(db, "todo", OWNER, name);
const ref = (name, id) => doc(db, "todo", OWNER, name, id);
uid = OWNER;
unsubs.push(onSnapshot(col("tasks"), s => { tasks = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, fbErr));
unsubs.push(onSnapshot(col("lists"), s => {
  lists = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); render(); }, fbErr));
function fbErr(e) {
  console.error(e);
  toast("Hata: " + (e.code === "permission-denied" ? "Firestore kuralları yayınlanmamış" : (e.code || e.message)));
}

/* ---------- Görünümler ---------- */
const VIEWS = {
  today:     { name: "Bugün",       icon: "☀️", f: t => !t.daily && !t.mine && !t.done && t.due && t.due <= today() },
  daily:     { name: "Günlük",      icon: "🔄", f: t => t.daily, cnt: t => t.daily && !doneToday(t) },
  mine:      { name: "Kendim",      icon: "👤", f: t => t.mine && !t.daily && !t.done },
  upcoming:  { name: "Yaklaşan",    icon: "📅", f: t => !t.daily && !t.mine && !t.done && t.due && t.due > today() },
  important: { name: "Önemli",      icon: "⭐", f: t => !t.daily && !t.mine && !t.done && t.priority === 3 },
  all:       { name: "Tümü",        icon: "📋", f: t => !t.daily && !t.mine && !t.done },
  nodate:    { name: "Tarihsiz",    icon: "🗂️", f: t => !t.daily && !t.mine && !t.done && !t.due },
  done:      { name: "Tamamlanan",  short: "Biten", icon: "✅", f: t => !t.daily && t.done },
};
const doneToday = t => t.daily && (t.dailyDone ?? !!t.lastDone);   // günlükler sabit: gece sıfırlanmaz
const isDone = t => t.daily ? doneToday(t) : t.done;
const vcount = k => tasks.filter(VIEWS[k].cnt || VIEWS[k].f).length;
const currentListId = () => view.startsWith("list:") ? view.slice(5) : "";
function viewInfo() {
  if (view.startsWith("list:")) {
    const l = lists.find(x => x.id === currentListId());
    if (!l) { view = "today"; return VIEWS.today; }
    return { name: l.name, icon: l.icon || "📁", f: t => !t.daily && !t.done && t.listId === l.id, list: l };
  }
  return VIEWS[view] || VIEWS.today;
}
function setView(v) { view = v; localStorage.setItem("view", v); closeSheets(); render(); window.scrollTo(0, 0); }

/* ---------- Sıralama ---------- */
const SORTS = { smart: "Akıllı (tarih + öncelik)", due: "Tarihe göre", prio: "Önceliğe göre", created: "Eklenme (yeni → eski)", alpha: "Alfabetik" };
const ts = x => x?.toMillis ? x.toMillis() : (x || 0);
function sorter(a, b) {
  const dd = (a.due || "9999") .localeCompare(b.due || "9999");
  const tt = (a.time || "99").localeCompare(b.time || "99");
  if (sortBy === "due") return dd || tt || b.priority - a.priority;
  if (sortBy === "prio") return b.priority - a.priority || dd;
  if (sortBy === "created") return ts(b.createdAt) - ts(a.createdAt);
  if (sortBy === "alpha") return a.title.localeCompare(b.title, "tr");
  if (view === "done") return ts(b.doneAt) - ts(a.doneAt);
  return dd || b.priority - a.priority || tt || ts(a.createdAt) - ts(b.createdAt);
}

/* ---------- Çizim ---------- */
function render() {
  if (!uid) return;
  const v = viewInfo();
  $("#viewTitle").textContent = `${v.icon} ${v.name}`;
  const q = $("#q").value.trim().toLocaleLowerCase("tr");
  let items = tasks.filter(v.f);
  if (q) {
    items = tasks.filter(t => {
      if (q.startsWith("#")) return (t.tags || []).some(g => g.startsWith(q.slice(1)));
      return (t.title + " " + (t.note || "") + " " + (t.tags || []).join(" ")).toLocaleLowerCase("tr").includes(q);
    });
  }
  items.sort(sorter);
  const open = tasks.filter(t => !t.daily && !t.done).length;
  $("#viewSub").textContent = new Date().toLocaleDateString("tr-TR", { weekday:"long", day:"numeric", month:"long" }) + ` · ${items.length} görev · toplam ${open} açık`;
  renderChips();

  const el = $("#list");
  if (!items.length) {
    el.innerHTML = `<div class="empty"><div>${q ? "🔍" : "🎉"}</div>${q ? "Sonuç yok" : view === "done" ? "Henüz tamamlanan yok" : "Burada görev yok. Aşağıdan ekle!"}</div>`;
    return;
  }
  // Gruplama
  let groups;
  if (q || view === "done" || sortBy !== "smart") groups = [["", items]];
  else if (view === "daily") {
    groups = [["Yapılacak", items.filter(t => !doneToday(t))], ["Tamamlandı", items.filter(doneToday)]];
  } else if (view === "today") {
    const late = items.filter(t => t.due < today()), tod = items.filter(t => t.due === today());
    groups = [["Gecikmiş", late], ["Bugün", tod]];
  } else if (view === "upcoming" || view === "mine" || view === "all" || view.startsWith("list:") || view === "important") {
    const m = new Map();
    items.forEach(t => {
      const k = !t.due ? "Tarihsiz" : t.due < today() ? "Gecikmiş" : t.due === today() ? "Bugün" : t.due === addDays(today(), 1) ? "Yarın" : fmtDate(t.due);
      if (!m.has(k)) m.set(k, []); m.get(k).push(t);
    });
    groups = [...m.entries()];
    groups.sort((a, b) => (a[0] === "Tarihsiz") - (b[0] === "Tarihsiz"));
  } else groups = [["", items]];

  el.innerHTML = groups.filter(g => g[1].length).map(([name, arr]) =>
    (name ? `<div class="group-title"><span>${esc(name)}</span><span>${arr.length}</span></div>` : "") + arr.map(taskHTML).join("")
  ).join("");
}
function taskHTML(t) {
  const d = dueLabel(t), l = lists.find(x => x.id === t.listId);
  const subs = t.subtasks || [], sd = subs.filter(s => s.d).length;
  const meta = [
    !t.daily && d && `<span class="${d.cls}">📅 ${esc(d.txt)}</span>`,
    t.repeat && t.repeat !== "none" && `<span>🔁 ${REP[t.repeat]}</span>`,
    subs.length && `<span>☑️ ${sd}/${subs.length}</span>`,
    t.note && `<span>📝</span>`,
    l && !view.startsWith("list:") && `<span style="color:${l.color}">${esc(l.icon || "📁")} ${esc(l.name)}</span>`,
    ...(t.tags || []).map(g => `<span>#${esc(g)}</span>`)
  ].filter(Boolean).join("");
  const dn = isDone(t);
  return `<div class="task p${t.priority} ${dn ? "done" : ""}" data-id="${t.id}">
    <button class="chk" data-chk="${t.id}" aria-label="Tamamla">${dn ? "✓" : ""}</button>
    <div class="t-body"><div class="t-title">${esc(t.title)}</div>${meta ? `<div class="t-meta">${meta}</div>` : ""}</div>
  </div>`;
}
function renderChips() {
  const base = ["today", "daily", "mine", "important", "all", "done"].map(k =>
    `<button class="chip ${view === k ? "on" : ""}" data-view="${k}">${VIEWS[k].icon} ${VIEWS[k].short || VIEWS[k].name}<span class="n">${vcount(k)}</span></button>`);
  const ls = lists.map(l => {
    const n = tasks.filter(t => !t.daily && !t.done && t.listId === l.id).length;
    return `<button class="chip ${view === "list:" + l.id ? "on" : ""}" data-view="list:${l.id}">${esc(l.icon || "📁")} ${esc(l.name)}<span class="n">${n}</span></button>`;
  });
  $("#chips").innerHTML = [...base, ...ls].join("");
}

  await addDoc(col("tasks"), {

async function toggleDone(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  const r = ref("tasks", id);
  if (t.daily) {
    const nv = !doneToday(t);
    await updateDoc(r, { dailyDone: nv, lastDone: "", updatedAt: serverTimestamp() }).catch(fbErr);
    if (nv) { navigator.vibrate?.(25); toast("✅ Tamamlandı", "Geri al", () => updateDoc(r, { dailyDone: false })); }
    return;
  }
  if (!t.done && t.repeat && t.repeat !== "none") {
    // Tekrarlı görev: bir sonraki tarihe taşı, alt görevleri sıfırla
    const nd = nextDue(t.due && t.due >= today() ? t.due : today(), t.repeat);
    await updateDoc(r, { due: nd, subtasks: (t.subtasks || []).map(s => ({ ...s, d: false })), updatedAt: serverTimestamp() }).catch(fbErr);
    toast(`🔁 Sonraki: ${fmtDate(nd)}`);
    return;
  }
  await updateDoc(r, { done: !t.done, doneAt: !t.done ? serverTimestamp() : null, updatedAt: serverTimestamp() }).catch(fbErr);
  if (!t.done) { navigator.vibrate?.(25); toast("✅ Tamamlandı", "Geri al", () => updateDoc(r, { done: false, doneAt: null })); }
}

async function toggleDaily(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  const r = ref("tasks", id);
  if (t.daily) {
    await updateDoc(r, { daily: false, updatedAt: serverTimestamp() }).catch(fbErr);
    toast("Günlükten çıkarıldı", "Geri al", () => updateDoc(r, { daily: true }));
  } else {
    await updateDoc(r, { daily: true, mine: false, done: false, doneAt: null, dailyDone: false, updatedAt: serverTimestamp() }).catch(fbErr);
    toast("🔄 Günlük görevlere taşındı", "Git", () => setView("daily"));
  }
  navigator.vibrate?.(15);
}

/* ---------- Basılı tut → sekmeye taşı ---------- */
function moveTargets(t) {
  const base = ["today", "daily", "mine", "important", "all", "done"].map(k => ({ key: k, icon: VIEWS[k].icon, name: VIEWS[k].name }));
  const ls = lists.map(l => ({ key: "list:" + l.id, icon: l.icon || "📁", name: l.name }));
  const cur = t.daily ? "daily" : t.mine ? "mine" : t.done ? "done" : null;
  return [...base, ...ls].map(x => ({ ...x, cur: x.key === cur }));
}
async function moveTo(t, key) {
  const r = ref("tasks", t.id);
  const clean = { daily: false, mine: false, done: false, doneAt: null, dailyDone: false, updatedAt: serverTimestamp() };
  let data, label;
  if (key === "today")          data = { ...clean, due: today() };
  else if (key === "daily")     data = { ...clean, daily: true };
  else if (key === "mine")      data = { ...clean, mine: true };
  else if (key === "important") data = { ...clean, priority: 3 };
  else if (key === "all")       data = { ...clean };
  else if (key === "done")      data = { ...clean, done: true, doneAt: serverTimestamp() };
  else if (key.startsWith("list:")) data = { ...clean, listId: key.slice(5) };
  if (!data) return;
  const before = { daily: !!t.daily, mine: !!t.mine, done: !!t.done, dailyDone: !!t.dailyDone, due: t.due || "", priority: t.priority || 0, listId: t.listId || "" };
  await updateDoc(r, data).catch(fbErr);
  label = key.startsWith("list:") ? (lists.find(l => l.id === key.slice(5))?.name || "liste") : VIEWS[key].name;
  navigator.vibrate?.(20);
  toast(`➡️ ${label} sekmesine taşındı`, "Geri al", () => updateDoc(r, before));
}
let mv = null;   // { task, timer, x, y, open, hl }
function openMoveMenu(t, x, y) {
  const m = $("#moveMenu");
  m.innerHTML = `<div class="mh">“${esc(t.title)}” → taşı</div>` +
    moveTargets(t).map(o => `<button data-mv="${o.key}" class="${o.cur ? "cur" : ""}">${esc(o.icon)} <span>${esc(o.name)}</span></button>`).join("");
  m.classList.remove("hidden");
  const w = m.offsetWidth, h = m.offsetHeight, W = innerWidth, H = innerHeight;
  m.style.left = Math.max(8, Math.min(W - w - 8, x - w / 2)) + "px";
  m.style.top = Math.max(8 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--safe-t")) || 0), Math.min(H - h - 8, y - h / 2)) + "px";
  $("#moveOverlay").classList.add("on");
  mv.open = true; mv.hl = null;
  navigator.vibrate?.(30);
}
function closeMoveMenu() {
  $("#moveMenu").classList.add("hidden"); $("#moveOverlay").classList.remove("on");
  document.querySelectorAll(".task.pressing").forEach(e => e.classList.remove("pressing"));
  mv = null;
}
function hlAt(x, y) {
  const el = document.elementFromPoint(x, y)?.closest("[data-mv]");
  document.querySelectorAll("#moveMenu [data-mv]").forEach(b => b.classList.toggle("hl", b === el));
  if (el && mv.hl !== el.dataset.mv) navigator.vibrate?.(8);
  mv.hl = el ? el.dataset.mv : null;
}
$("#list").addEventListener("touchstart", e => {
  const card = e.target.closest(".task");
  if (!card || e.target.closest("[data-chk]") || e.touches.length > 1) return;
  const t = tasks.find(x => x.id === card.dataset.id); if (!t) return;
  const p = e.touches[0];
  mv = { task: t, x: p.clientX, y: p.clientY, open: false, hl: null, card };
  card.classList.add("pressing");
  mv.timer = setTimeout(() => mv && openMoveMenu(t, mv.x, mv.y), 450);
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!mv) return;
  const p = e.touches[0];
  if (!mv.open) {
    if (Math.hypot(p.clientX - mv.x, p.clientY - mv.y) > 10) { clearTimeout(mv.timer); mv.card.classList.remove("pressing"); mv = null; }
    return;
  }
  if (e.cancelable) e.preventDefault();   // menü açıkken sayfa kaymasın
  hlAt(p.clientX, p.clientY);
}, { passive: false });
document.addEventListener("touchend", () => {
  if (!mv) return;
  clearTimeout(mv.timer);
  if (!mv.open) { mv.card.classList.remove("pressing"); mv = null; return; }
  suppressClick = true; setTimeout(() => suppressClick = false, 400);
  if (mv.hl) { const t = mv.task, k = mv.hl; closeMoveMenu(); moveTo(t, k); }
  else mv.card.classList.remove("pressing");   // parmak boşta bırakıldı: menü açık kalsın, dokunarak seç
});
document.addEventListener("touchcancel", () => { if (mv && !mv.open) { clearTimeout(mv.timer); mv.card.classList.remove("pressing"); mv = null; } });
$("#moveMenu").addEventListener("click", e => {
  if (suppressClick) return;   // parmak kalkınca oluşan sahte tıklamayı yok say
  const b = e.target.closest("[data-mv]"); if (!b || !mv) return;
  const t = mv.task; closeMoveMenu(); moveTo(t, b.dataset.mv);
});
$("#moveOverlay").onclick = () => { if (!suppressClick) closeMoveMenu(); };
// Bilgisayarda sağ tık
$("#list").addEventListener("contextmenu", e => {

/* ---------- Görev düzenleyici ---------- */
function openTask(id) {
  editing = id ? tasks.find(t => t.id === id) : null;
  const t = editing || { title: "", note: "", due: "", time: "", priority: 0, listId: currentListId(), repeat: "none", tags: [], subtasks: [] };
  $("#sheetTitle").textContent = editing ? "Görevi düzenle" : "Yeni görev";
  $("#fTitle").value = t.title; $("#fNote").value = t.note || "";
  $("#fDue").value = t.due || ""; $("#fTime").value = t.time || "";
  $("#fRepeat").value = t.repeat || "none"; $("#fTags").value = (t.tags || []).join(", ");
  $("#fList").innerHTML = `<option value="">— Liste yok —</option>` + lists.map(l => `<option value="${l.id}">${esc(l.icon || "📁")} ${esc(l.name)}</option>`).join("");
  $("#fList").value = t.listId || "";
  prioDraft = t.priority || 0; paintPrio();
  subDraft = (t.subtasks || []).map(s => ({ ...s })); paintSubs();
  $("#delTask").classList.toggle("hidden", !editing);
  openSheet("#taskSheet");
}
function paintPrio() { document.querySelectorAll("#fPrio button").forEach(b => b.classList.toggle("on", +b.dataset.v === prioDraft)); }
$("#fPrio").onclick = e => { const b = e.target.closest("button"); if (b) { prioDraft = +b.dataset.v; paintPrio(); } };
function paintSubs() {
  $("#fSubs").innerHTML = subDraft.map((s, i) => `<div class="s">
    <input type="checkbox" class="cb" data-i="${i}" ${s.d ? "checked" : ""}>
    <input type="text" class="inp" data-t="${i}" value="${esc(s.t)}" placeholder="Alt görev">
    <button class="x" data-x="${i}" type="button">✕</button></div>`).join("");
}
$("#fSubs").oninput = e => { if (e.target.dataset.t !== undefined) subDraft[+e.target.dataset.t].t = e.target.value; };

$("#saveTask").onclick = async () => {
  const title = $("#fTitle").value.trim(); if (!title) return $("#fTitle").focus();
  const data = {
    title, note: $("#fNote").value.trim(), due: $("#fDue").value, time: $("#fTime").value,
    priority: prioDraft, listId: $("#fList").value, repeat: $("#fRepeat").value,
    tags: $("#fTags").value.split(",").map(s => s.trim().replace(/^#/, "").toLowerCase()).filter(Boolean).slice(0, 20),
    subtasks: subDraft.filter(s => s.t.trim()).map(s => ({ t: s.t.trim(), d: !!s.d })),

  };

};

if (isStandalone()) $("#installBtn").classList.add("hidden");
$("#installBtn").onclick = async () => {
  if (installEvt) {                       // Android / Chrome: tek dokunuşla kurulum
    closeSheets(); installEvt.prompt();
    await installEvt.userChoice.catch(() => {}); installEvt = null; return;
  }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  $("#installSteps").innerHTML = ios
    ? `<p>iPhone otomatik eklemeye izin vermiyor, 3 adımda ekleyebilirsin:</p>
       <p><b>1.</b> Adres çubuğundaki <b>Paylaş</b> simgesine dokun <span style="font-size:20px">⬆️</span></p>
       <p><b>2.</b> Listeyi aşağı kaydır, <b>“Ana Ekrana Ekle”</b>yi seç ➕</p>
       <p><b>3.</b> Sağ üstten <b>Ekle</b>'ye dokun.</p>
       <p class="sub">Simge ana ekranda “Yapılacaklar” adıyla görünür ve tam ekran açılır.</p>`
    : `<p>Tarayıcı menüsünü (⋮) aç ve <b>“Ana ekrana ekle”</b> / <b>“Uygulamayı yükle”</b>yi seç.</p>
       <p class="sub">Seçenek görünmezse sayfayı bir kez yenileyip tekrar dene.</p>`;
  openSheet("#installSheet");
};

/* ---------- Güncelleme denetimi ----------
   Yeni sürüm yayınlarken APP_VERSION ve version.json birlikte değiştirilir. */
const APP_VERSION = "2026.11.18-1656";
$("#verLbl").textContent = "v" + APP_VERSION;
async function checkUpdate(silent) {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    if (v && v !== APP_VERSION) {
      if (silent) return toast("🆕 Yeni sürüm hazır", "Güncelle", () => reloadFresh(v));
      toast("🆕 Yeni sürüm yükleniyor…"); setTimeout(() => reloadFresh(v), 600);
    } else if (!silent) toast("✅ Uygulama güncel (v" + APP_VERSION + ")");
  } catch (e) { if (!silent) toast("İnternet yok, denetlenemedi"); }
}
function reloadFresh(v) { location.replace(location.pathname + "?v=" + encodeURIComponent(v)); }
$("#updateBtn").onclick = () => { closeSheets(); checkUpdate(false); };
setTimeout(() => checkUpdate(true), 3000);   // açılışta sessiz kontrol

/* ---------- Liste düzenleyici ---------- */
function openList(id) {
  editingList = id ? lists.find(l => l.id === id) : null;
  $("#listSheetTitle").textContent = editingList ? "Listeyi düzenle" : "Yeni liste";
  $("#lName").value = editingList?.name || ""; $("#lIcon").value = editingList?.icon || "";
  colorDraft = editingList?.color || COLORS[lists.length % COLORS.length]; paintColors();
  $("#delList").classList.toggle("hidden", !editingList);
  openSheet("#listSheet"); setTimeout(() => $("#lName").focus(), 250);
}
function paintColors() { $("#lColors").innerHTML = COLORS.map(c => `<button style="background:${c}" data-c="${c}" class="${c === colorDraft ? "on" : ""}"></button>`).join(""); }
$("#lColors").onclick = e => { const c = e.target.dataset.c; if (c) { colorDraft = c; paintColors(); } };
$("#saveList").onclick = async () => {
  const name = $("#lName").value.trim(); if (!name) return $("#lName").focus();
  const data = { name, icon: $("#lIcon").value.trim() || "📁", color: colorDraft };
  closeSheets();
  if (editingList) await updateDoc(ref("lists", editingList.id), data).catch(fbErr);
  else { const r = await addDoc(col("lists"), { ...data, order: lists.length, createdAt: serverTimestamp() }).catch(fbErr); if (r) setView("list:" + r.id); }
};
$("#delList").onclick = async () => {
  if (!editingList) return;
  const inList = tasks.filter(t => t.listId === editingList.id);
  if (!confirm(`"${editingList.name}" silinsin mi?${inList.length ? `\n${inList.length} görev "Liste yok"a taşınacak.` : ""}`)) return;
  const b = writeBatch(db);
  inList.forEach(t => b.update(ref("tasks", t.id), { listId: "" }));
  b.delete(ref("lists", editingList.id));
  await b.commit().catch(fbErr);
  closeSheets(); if (view === "list:" + editingList.id) setView("today");
};

/* ---------- Sıralama menüsü ---------- */
$("#sortBtn").onclick = () => {
  $("#sortOpts").innerHTML = Object.entries(SORTS).map(([k, v]) => `<button class="menu-item" data-sort="${k}">${sortBy === k ? "●" : "○"} <span>${v}</span></button>`).join("");
  openSheet("#sortSheet");
};
$("#sortOpts").onclick = e => { const b = e.target.closest("[data-sort]"); if (b) { sortBy = b.dataset.sort; localStorage.setItem("sort", sortBy); closeSheets(); render(); } };

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, actLabel, act) {
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>` + (actLabel ? `<button>${esc(actLabel)}</button>` : "");
  if (act) el.querySelector("button").onclick = () => { act(); el.remove(); };
  document.body.appendChild(el); toastTimer = setTimeout(() => el.remove(), 4000);
}

// Gün değişince (gece yarısı) görünümü yenile
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
document.addEventListener("visibilitychange", () => !document.hidden && render());
</script>
</body>
