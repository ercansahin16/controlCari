<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cari Takip</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f1115;
    --card:#1a1d24;
    --card2:#20242c;
    --border:#2a2f3a;
    --text:#e7e9ee;
    --muted:#8b93a3;
    --accent:#5b8dee;
    --danger:#e5566d;
    --danger-bg:#2a1820;
    --ok:#3fbf7f;
    --warn:#e0a83f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body{
    touch-action: manipulation; /* cift tiklama/pinch ile yakinlastirmayi engeller */
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:12.5px;
    max-width:480px;
    margin:0 auto;
    padding-bottom:24px;
  }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:10px 12px 8px 12px;
    border-bottom:1px solid var(--border);
  }
  .topbar h1{
    font-size:15px; margin:0 0 2px 0; font-weight:700; letter-spacing:.2px;
  }
  #userInfo{
    font-size:10px; color:var(--muted); margin-bottom:6px;
  }
  #userInfo b{ color:var(--text); }
  #userInfo a{
    color:var(--accent); text-decoration:none; margin-left:6px;
  }
  #connStatus{
    font-size:10px; margin:0 0 8px 0; color:var(--warn);
  }
  .upload-row{
    display:flex; gap:6px; align-items:center;
  }
  .upload-btn{
    flex:1;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    font-weight:600;
    text-align:center;
    display:block;
  }
  input[type=file]{ display:none; }
  .search{
    margin-top:8px;
    width:100%;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 9px;
    color:var(--text);
    font-size:12px;
  }
  .summary{
    display:flex; gap:6px; margin-top:8px;
  }
  .chip{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
    text-align:center;
  }
  .chip .n{ font-size:13px; font-weight:700; display:block; }
  .chip .l{ font-size:10px; color:var(--muted); }
  .list{ padding:8px 10px; }
  .empty{
    color:var(--muted);
    text-align:center;
    padding:40px 20px;
    font-size:12px;
    line-height:1.6;
  }
  .row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 10px;
    margin-bottom:7px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .row.flagged{
    border-color:var(--danger);
    background:var(--danger-bg);
  }
  .row .left{ min-width:0; flex:1; }
  .row .name{
    font-size:12.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row .note-preview{
    font-size:10.5px; color:var(--danger);
    margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row .due{
    font-size:10px; color:var(--warn); margin-top:2px;
  }
  .row .editor{
    font-size:9.5px; color:var(--accent); margin-top:2px;
  }
  .row .right{
    text-align:right; flex-shrink:0;
  }
  .row .debt{
    font-size:13px; font-weight:700;
  }
  .row .debt.zero{ color:var(--ok); }
  .row .badge{
    font-size:9px; color:var(--muted); margin-top:2px;
  }
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; align-items:flex-end; z-index:20;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background:var(--card); width:100%;
    border-radius:14px 14px 0 0;
    padding:14px 14px 18px 14px;
    max-height:85vh; overflow-y:auto;
  }
  .sheet h2{ font-size:13.5px; margin:0 0 2px 0; }
  .sheet .sub{ font-size:11px; color:var(--muted); margin-bottom:10px; }
  .field{ margin-bottom:10px; }
  .field label{
    display:block; font-size:10.5px; color:var(--muted); margin-bottom:4px;
  }
  .field textarea, .field input[type=date]{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:8px; font-size:12px;
    font-family:inherit;
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .field input[type=number]{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:8px; font-size:13px;
    font-family:inherit;
  }

  /* Ozel tarih secici */
  .date-field-wrap{ position:relative; }
  .date-field{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:8px; font-size:12px;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .date-field .placeholder{ color:var(--muted); }
  .calendar-popup{
    display:none;
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--card2); border:1px solid var(--border);
    border-radius:10px; padding:8px; z-index:30;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .calendar-popup.show{ display:block; }
  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px; font-size:12px; font-weight:600;
  }
  .cal-header button{
    background:none; border:none; color:var(--text); font-size:16px;
    padding:2px 8px; cursor:pointer;
  }
  .cal-weekdays, .cal-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; text-align:center;
  }
  .cal-weekdays div{ font-size:9px; color:var(--muted); padding:2px 0; }
  .cal-grid div{
    font-size:11px; padding:6px 0; border-radius:6px; cursor:pointer;
  }
  .cal-grid div.day:hover{ background:var(--card); }
  .cal-grid div.empty{ cursor:default; }
  .cal-grid div.today{ border:1px solid var(--accent); }
  .cal-grid div.selected{ background:var(--accent); color:#fff; font-weight:700; }
  .cal-footer{
    display:flex; gap:6px; margin-top:6px;
  }
  .cal-footer button{
    flex:1; background:var(--card); border:1px solid var(--border);
    color:var(--text); border-radius:6px; padding:6px; font-size:10.5px; cursor:pointer;
  }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card2); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; margin-bottom:10px;
  }
  .toggle-row span{ font-size:11.5px; }
  .switch{
    width:38px; height:21px; background:#3a3f4a; border-radius:12px;
    position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch.on{ background:var(--danger); }
  .switch .dot{
    width:17px; height:17px; background:#fff; border-radius:50%;
    position:absolute; top:2px; left:2px; transition:left .15s;
  }
  .switch.on .dot{ left:19px; }
  .btn-row{ display:flex; gap:8px; margin-top:4px; }
  .btn{
    flex:1; border:none; border-radius:8px; padding:10px; font-size:12px;
    font-weight:600;
  }
  .btn.save{ background:var(--accent); color:#fff; }
  .btn.close{ background:var(--card2); color:var(--text); border:1px solid var(--border); }
  .btn.delete{ background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger); flex:0 0 auto; padding:10px 12px; }
  .status{
    font-size:10.5px; color:var(--muted); text-align:center; padding:4px 0 0 0;
  }

  /* Kilit ekrani */
  #lockScreen{
    position:fixed; inset:0; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:24px;
  }
  #lockScreen.hidden{ display:none; }
  .lock-box{ width:100%; max-width:280px; text-align:center; }
  .lock-box h2{ font-size:15px; margin:0 0 4px 0; }
  .lock-box p{ font-size:11px; color:var(--muted); margin:0 0 16px 0; }
  .lock-box input{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:11px; font-size:16px;
    text-align:center; letter-spacing:4px; margin-bottom:10px;
  }
  .lock-box button{
    width:100%; background:var(--accent); color:#fff; border:none;
    border-radius:8px; padding:11px; font-size:13px; font-weight:600;
  }
  .lock-box .err{ color:var(--danger); font-size:11px; margin-top:8px; min-height:14px; }
  #appRoot.locked{ display:none; }
  .hidden{ display:none !important; }
  .role-btn{
    width:100%; border:none; border-radius:8px; padding:13px; font-size:13px;
    font-weight:700; margin-bottom:10px; cursor:pointer;
  }
  .role-btn.sales{ background:var(--ok); color:#06281a; }
  .role-btn.admin{ background:var(--accent); color:#fff; }
  .role-form p{ font-size:12px; color:var(--text); font-weight:600; margin:0 0 10px 0; }
  .back-link{
    display:block; font-size:11px; color:var(--muted); margin-top:8px; text-decoration:none;
  }
  .row .tags{ margin-top:2px; }
  .row .tag{
    display:inline-block; font-size:9px; color:var(--muted);
    background:var(--card2); border:1px solid var(--border);
    border-radius:5px; padding:1px 5px; margin-right:4px;
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>Cari Takip</h2>

    <div id="roleChoice">
      <p style="font-size:11px;color:var(--muted);margin:0 0 14px 0;">Giris turunu secin</p>
      <button type="button" class="role-btn sales" id="roleSalesBtn">Plasiyer Girisi</button>
      <button type="button" class="role-btn admin" id="roleAdminBtn">Yonetici Girisi</button>
    </div>

    <div id="salesForm" class="role-form hidden">
      <p>Plasiyer Girisi</p>
      <input type="text" id="salesNameInput" placeholder="Adiniz Soyadiniz" autocomplete="name" />
      <input type="text" id="salesPlakaInput" placeholder="Plaka(lariniz) - virgulle ayirin" />
      <input type="password" inputmode="numeric" id="salesPinInput" placeholder="PIN" maxlength="12" />
      <button type="button" id="salesSubmit">Giris</button>
      <a href="#" class="back-link" id="salesBack">‹ Geri</a>
    </div>

    <div id="adminForm" class="role-form hidden">
      <p>Yonetici Girisi</p>
      <input type="text" id="adminNameInput" placeholder="Adiniz Soyadiniz" autocomplete="name" />
      <input type="password" inputmode="numeric" id="adminPinInput" placeholder="PIN" maxlength="12" />
      <button type="button" id="adminSubmit">Giris</button>
      <a href="#" class="back-link" id="adminBack">‹ Geri</a>
    </div>

    <div class="err" id="pinError"></div>
  </div>
</div>

<div id="appRoot" class="locked">
<div class="topbar">
  <h1>Cari Takip</h1>
  <div id="userInfo">-</div>
  <div id="connStatus">Baglaniyor...</div>
  <div class="upload-row" id="uploadRow">
    <label class="upload-btn" for="fileInput" id="uploadLabel">Excel Yukle (.xlsx)</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" />
  </div>
  <input class="search" id="searchBox" placeholder="Cari ara..." />
  <div class="summary">
    <div class="chip"><span class="n" id="sumCount">0</span><span class="l">Cari</span></div>
    <div class="chip"><span class="n" id="sumDebt">0</span><span class="l">Toplam Bakiye</span></div>
    <div class="chip"><span class="n" id="sumFlag">0</span><span class="l">Sorunlu</span></div>
  </div>
</div>

<div class="list" id="list">
  <div class="empty">Henuz veri yok.<br/>Yukaridan bir Excel dosyasi yukleyin.</div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="detailName">-</h2>
    <div class="sub" id="detailEditor">-</div>
    <div class="sub" id="detailMeta">-</div>

    <div class="field">
      <label>Kalan Bakiye</label>
      <input type="number" step="0.01" inputmode="decimal" id="debtInput" />
    </div>

    <div class="toggle-row">
      <span>Sorunlu / Odeme problemi var</span>
      <div class="switch" id="flagSwitch"><div class="dot"></div></div>
    </div>

    <div class="field">
      <label>Aciklama (not)</label>
      <textarea id="noteInput" placeholder="Ornek: Musteri 20 Eylulde odeyecegini soyledi, iki kez erteledi."></textarea>
    </div>

    <div class="field date-field-wrap">
      <label>Odeme Beklenen Tarih</label>
      <div class="date-field" id="dueFieldBtn">
        <span id="dueDisplay" class="placeholder">Tarih secilmedi</span>
        <span>📅</span>
      </div>
      <input type="hidden" id="dueInput" />
      <div class="calendar-popup" id="calendarPopup">
        <div class="cal-header">
          <button type="button" id="calPrev">‹</button>
          <span id="calMonthLabel"></span>
          <button type="button" id="calNext">›</button>
        </div>
        <div class="cal-weekdays">
          <div>Pt</div><div>Sa</div><div>Ca</div><div>Pe</div><div>Cu</div><div>Ct</div><div>Pz</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-footer">
          <button type="button" id="calToday">Bugun</button>
          <button type="button" id="calClear">Temizle</button>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn close" id="closeBtn">Kapat</button>
      <button class="btn delete" id="deleteBtn">Sil</button>
      <button class="btn save" id="saveBtn">Kaydet</button>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>
</div>

</div><!-- #appRoot -->

<script type="module" src="app.js"></script>
</body>
</html>
