<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f1115;
    --card:#1a1d24;
    --card2:#20242c;
    --border:#2a2f3a;
    --text:#e7e9ee;
    --muted:#8b93a3;
    --accent:#5b8dee;
    --danger:#e5566d;
    --danger-bg:#2a1820;
    --ok:#3fbf7f;
    --warn:#e0a83f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:12.5px;
    max-width:480px;
    margin:0 auto;
    padding-bottom:24px;
  }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:10px 12px 8px 12px;
    border-bottom:1px solid var(--border);
  }
  .topbar h1{
    font-size:15px; margin:0 0 8px 0; font-weight:700; letter-spacing:.2px;
  }
  .upload-row{
    display:flex; gap:6px; align-items:center;
  }
  .upload-btn{
    flex:1;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    font-weight:600;
    text-align:center;
    display:block;
  }
  input[type=file]{ display:none; }
  .search{
    margin-top:8px;
    width:100%;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 9px;
    color:var(--text);
    font-size:12px;
  }
  .summary{
    display:flex; gap:6px; margin-top:8px;
  }
  .chip{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
    text-align:center;
  }
  .chip .n{ font-size:13px; font-weight:700; display:block; }
  .chip .l{ font-size:10px; color:var(--muted); }
  .list{ padding:8px 10px; }
  .empty{
    color:var(--muted);
    text-align:center;
    padding:40px 20px;
    font-size:12px;
    line-height:1.6;
  }
  .row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 10px;
    margin-bottom:7px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .row.flagged{
    border-color:var(--danger);
    background:var(--danger-bg);
  }
  .row .left{ min-width:0; flex:1; }
  .row .name{
    font-size:12.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row .note-preview{
    font-size:10.5px; color:var(--danger);
    margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row .due{
    font-size:10px; color:var(--warn); margin-top:2px;
  }
  .row .right{
    text-align:right; flex-shrink:0;
  }
  .row .debt{
    font-size:13px; font-weight:700;
  }
  .row .debt.zero{ color:var(--ok); }
  .row .badge{
    font-size:9px; color:var(--muted); margin-top:2px;
  }
  /* Detail panel */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; align-items:flex-end; z-index:20;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background:var(--card); width:100%;
    border-radius:14px 14px 0 0;
    padding:14px 14px 18px 14px;
    max-height:85vh; overflow-y:auto;
  }
  .sheet h2{ font-size:13.5px; margin:0 0 2px 0; }
  .sheet .sub{ font-size:11px; color:var(--muted); margin-bottom:10px; }
  .field{ margin-bottom:10px; }
  .field label{
    display:block; font-size:10.5px; color:var(--muted); margin-bottom:4px;
  }
  .field textarea, .field input[type=date]{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:8px; font-size:12px;
    font-family:inherit;
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card2); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; margin-bottom:10px;
  }
  .toggle-row span{ font-size:11.5px; }
  .switch{
    width:38px; height:21px; background:#3a3f4a; border-radius:12px;
    position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch.on{ background:var(--danger); }
  .switch .dot{
    width:17px; height:17px; background:#fff; border-radius:50%;
    position:absolute; top:2px; left:2px; transition:left .15s;
  }
  .switch.on .dot{ left:19px; }
  .btn-row{ display:flex; gap:8px; margin-top:4px; }
  .btn{
    flex:1; border:none; border-radius:8px; padding:10px; font-size:12px;
    font-weight:600;
  }
  .btn.save{ background:var(--accent); color:#fff; }
  .btn.close{ background:var(--card2); color:var(--text); border:1px solid var(--border); }
  .status{
    font-size:10.5px; color:var(--muted); text-align:center; padding:4px 0 0 0;
  }
</style>

<div class="topbar">
  <h1>Cari Takip</h1>
  <div class="upload-row">
    <label class="upload-btn" for="fileInput" id="uploadLabel">Excel Yükle (.xlsx)</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" />
  </div>
  <input class="search" id="searchBox" placeholder="Cari ara..." />
  <div class="summary">
    <div class="chip"><span class="n" id="sumCount">0</span><span class="l">Cari</span></div>
    <div class="chip"><span class="n" id="sumDebt">0</span><span class="l">Toplam Bakiye</span></div>
    <div class="chip"><span class="n" id="sumFlag">0</span><span class="l">Sorunlu</span></div>
  </div>
</div>

<div class="list" id="list">
  <div class="empty">Henüz veri yok.<br/>Yukarıdan bir Excel dosyası yükleyin.<br/>Excel'de "Cari İsmi" ve bakiye/borç kolonu olmalı.</div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="detailName">-</h2>
    <div class="sub" id="detailDebt">-</div>

    <div class="toggle-row">
      <span>Sorunlu / Ödeme problemi var</span>
      <div class="switch" id="flagSwitch"><div class="dot"></div></div>
    </div>

    <div class="field">
      <label>Açıklama (not)</label>
      <textarea id="noteInput" placeholder="Örn: Müşteri 20 Eylül'de ödeyeceğini söyledi, iki kez erteledi."></textarea>
    </div>

    <div class="field">
      <label>Ödeme Beklenen Tarih</label>
      <input type="date" id="dueInput" />
    </div>

    <div class="btn-row">
      <button class="btn close" id="closeBtn">Kapat</button>
      <button class="btn save" id="saveBtn">Kaydet</button>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>
</div>

<script>
(function(){
  var STORAGE_LIST_KEY = "cari:list";
  var cariler = []; // {name, debt, raw}
  var notesCache = {}; // name -> {note, due, flagged}
  var currentName = null;

  function normalizeHeader(h){
    return (h||"").toString().toLocaleLowerCase("tr").trim();
  }
  function findCol(headers, keywords){
    for(var i=0;i<headers.length;i++){
      var h = normalizeHeader(headers[i]);
      for(var k=0;k<keywords.length;k++){
        if(h.indexOf(keywords[k]) !== -1) return i;
      }
    }
    return -1;
  }
  function parseNumber(v){
    if(typeof v === "number") return v;
    if(!v) return 0;
    var s = v.toString().replace(/[^\d,.\-]/g,"");
    // Turkish format: 1.234,56 -> 1234.56
    if(s.indexOf(",") !== -1 && s.indexOf(".") !== -1){
      s = s.replace(/\./g,"").replace(",", ".");
    } else if(s.indexOf(",") !== -1){
      s = s.replace(",", ".");
    }
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  function fmtMoney(n){
    return n.toLocaleString("tr-TR", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function keyFor(name){
    return "cari-note:" + name.toLocaleLowerCase("tr").trim();
  }

  async function loadNote(name){
    if(notesCache[name]) return notesCache[name];
    try{
      var res = await window.storage.get(keyFor(name), false);
      var val = res && res.value ? JSON.parse(res.value) : {note:"", due:"", flagged:false};
      notesCache[name] = val;
      return val;
    }catch(e){
      var empty = {note:"", due:"", flagged:false};
      notesCache[name] = empty;
      return empty;
    }
  }

  async function saveNote(name, data){
    notesCache[name] = data;
    try{
      await window.storage.set(keyFor(name), JSON.stringify(data), false);
      return true;
    }catch(e){
      return false;
    }
  }

  async function saveList(){
    try{
      await window.storage.set(STORAGE_LIST_KEY, JSON.stringify(cariler), false);
    }catch(e){}
  }

  async function loadList(){
    try{
      var res = await window.storage.get(STORAGE_LIST_KEY, false);
      if(res && res.value){
        cariler = JSON.parse(res.value);
      }
    }catch(e){}
  }

  async function preloadNotesForList(){
    for(var i=0;i<cariler.length;i++){
      await loadNote(cariler[i].name);
    }
  }

  async function render(){
    var list = document.getElementById("list");
    var q = document.getElementById("searchBox").value.toLocaleLowerCase("tr").trim();

    var filtered = cariler.filter(function(c){
      return !q || c.name.toLocaleLowerCase("tr").indexOf(q) !== -1;
    });

    if(cariler.length === 0){
      list.innerHTML = '<div class="empty">Henüz veri yok.<br/>Yukarıdan bir Excel dosyası yükleyin.<br/>Excel\'de "Cari İsmi" ve bakiye/borç kolonu olmalı.</div>';
    } else if(filtered.length === 0){
      list.innerHTML = '<div class="empty">Sonuç bulunamadı.</div>';
    } else {
      filtered.sort(function(a,b){ return b.debt - a.debt; });
      var html = "";
      for(var i=0;i<filtered.length;i++){
        var c = filtered[i];
        var n = notesCache[c.name] || {note:"", due:"", flagged:false};
        var flaggedClass = n.flagged ? " flagged" : "";
        var debtClass = c.debt === 0 ? " zero" : "";
        html += '<div class="row'+flaggedClass+'" data-name="'+escapeAttr(c.name)+'">';
        html += '  <div class="left">';
        html += '    <div class="name">'+escapeHtml(c.name)+'</div>';
        if(n.note){
          html += '    <div class="note-preview">'+escapeHtml(n.note)+'</div>';
        }
        if(n.due){
          html += '    <div class="due">Ödeme bekleniyor: '+escapeHtml(n.due)+'</div>';
        }
        html += '  </div>';
        html += '  <div class="right">';
        html += '    <div class="debt'+debtClass+'">'+fmtMoney(c.debt)+'</div>';
        if(n.flagged){
          html += '    <div class="badge">SORUNLU</div>';
        }
        html += '  </div>';
        html += '</div>';
      }
      list.innerHTML = html;

      var rows = list.querySelectorAll(".row");
      rows.forEach(function(row){
        row.addEventListener("click", function(){
          openDetail(row.getAttribute("data-name"));
        });
      });
    }

    // summary
    document.getElementById("sumCount").textContent = cariler.length;
    var totalDebt = cariler.reduce(function(s,c){ return s + c.debt; }, 0);
    document.getElementById("sumDebt").textContent = fmtMoney(totalDebt);
    var flagCount = 0;
    Object.keys(notesCache).forEach(function(k){ if(notesCache[k].flagged) flagCount++; });
    document.getElementById("sumFlag").textContent = flagCount;
  }

  function escapeHtml(s){
    return (s||"").toString()
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function escapeAttr(s){
    return escapeHtml(s).replace(/"/g,"&quot;");
  }

  async function openDetail(name){
    currentName = name;
    var c = cariler.find(function(x){ return x.name === name; });
    var n = await loadNote(name);

    document.getElementById("detailName").textContent = name;
    document.getElementById("detailDebt").textContent = "Kalan Bakiye: " + fmtMoney(c ? c.debt : 0);
    document.getElementById("noteInput").value = n.note || "";
    document.getElementById("dueInput").value = n.due || "";
    var sw = document.getElementById("flagSwitch");
    sw.classList.toggle("on", !!n.flagged);
    document.getElementById("saveStatus").textContent = "";
    document.getElementById("overlay").classList.add("show");
  }

  function closeDetail(){
    document.getElementById("overlay").classList.remove("show");
    currentName = null;
  }

  document.getElementById("flagSwitch").addEventListener("click", function(){
    this.classList.toggle("on");
  });

  document.getElementById("closeBtn").addEventListener("click", closeDetail);
  document.getElementById("overlay").addEventListener("click", function(e){
    if(e.target === this) closeDetail();
  });

  document.getElementById("saveBtn").addEventListener("click", async function(){
    if(!currentName) return;
    var data = {
      note: document.getElementById("noteInput").value,
      due: document.getElementById("dueInput").value,
      flagged: document.getElementById("flagSwitch").classList.contains("on")
    };
    var status = document.getElementById("saveStatus");
    status.textContent = "Kaydediliyor...";
    var ok = await saveNote(currentName, data);
    status.textContent = ok ? "Kaydedildi." : "Kaydedilemedi, tekrar deneyin.";
    render();
    setTimeout(closeDetail, ok ? 500 : 1200);
  });

  document.getElementById("searchBox").addEventListener("input", render);

  document.getElementById("fileInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var label = document.getElementById("uploadLabel");
    label.textContent = "Okunuyor...";
    var reader = new FileReader();
    reader.onload = async function(evt){
      try{
        var data = new Uint8Array(evt.target.result);
        var wb = XLSX.read(data, {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
        if(rows.length < 2){
          alert("Excel'de veri bulunamadı.");
          label.textContent = "Excel Yükle (.xlsx)";
          return;
        }
        var headers = rows[0];
        var nameCol = findCol(headers, ["cari isim", "cari ismi", "cari adı", "cari ad", "cari"]);
        var debtCol = findCol(headers, ["bakiye", "borç", "borc", "kalan"]);

        if(nameCol === -1){
          alert('Excel\\'de "Cari İsmi" kolonu bulunamadı. Lütfen bir kolon başlığında "cari" kelimesi olduğundan emin olun.');
          label.textContent = "Excel Yükle (.xlsx)";
          return;
        }

        var newList = [];
        for(var i=1;i<rows.length;i++){
          var r = rows[i];
          var nm = (r[nameCol]||"").toString().trim();
          if(!nm) continue;
          var debt = debtCol !== -1 ? parseNumber(r[debtCol]) : 0;
          newList.push({name: nm, debt: debt});
        }

        cariler = newList;
        await saveList();
        await preloadNotesForList();
        await render();
        label.textContent = "Excel Yükle (.xlsx)";
      }catch(err){
        alert("Dosya okunurken hata oluştu: " + err.message);
        label.textContent = "Excel Yükle (.xlsx)";
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  });

  (async function init(){
    await loadList();
    await preloadNotesForList();
    await render();
  })();
})();
</script>
